# CD pipeline (T-7-4, R-PROD-4): tag push (v*) or manual dispatch → publish
# the GHCR image with the tag + latest. CI already publishes main/v* images;
# this workflow makes the tag publish explicit and provides the manual
# dispatch entrypoint for re-publishing. The VM-side deploy is MANUAL and
# documented in docs/deploy-oracle.md (Oracle Cloud Always Free, $0).

name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Docker build
        run: docker build -t business-operations-platform:cd .

      - name: Publish to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/business-operations-platform
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${GITHUB_REF_NAME:-manual}"
          docker tag business-operations-platform:cd "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          docker tag business-operations-platform:cd "$IMAGE:latest"
          docker push "$IMAGE:latest"