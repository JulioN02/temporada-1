# BOP v1 — self-contained appliance (T-7-2, R-PROD-2).
#
# `docker compose up -d --build` runs the FULL stack offline: Postgres 16
# (volume + init scripts), one-shot migrate (SQL migrations + pg-boss
# schema/queue bootstrap — the prod boot race fix: the queue row exists
# BEFORE api/worker can enqueue), API + worker on the SAME image, and mailpit
# as the dev SMTP sink (UI on http://localhost:8025).
#
# Secrets: env-driven at RUNTIME only (never baked into the image). The
# ${VAR:-dev-default} pattern gives a working dev appliance with zero setup;
# production overrides them via a real .env (see docs/deploy-oracle.md).

services:
  db:
    image: postgres:16-alpine
    container_name: bop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bop
    ports:
      - "55437:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: SQL migrations + pgboss schema/queue bootstrap. api/worker wait
  # for service_completed_successfully — the queue exists before any enqueue.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bop-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/bop
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me-0123456789}
    command: sh -c "node backend/scripts/migrate.ts && node backend/scripts/ensure-queues.ts"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bop-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/bop
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me-0123456789}
      APP_VERSION: ${APP_VERSION:-dev}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: bop@localhost
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bop-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image HEALTHCHECK fetches the API port, which the worker does not
    # listen on — disable it here (the worker has no HTTP surface; the
    # restart policy covers crashes).
    healthcheck:
      disable: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://postgres:postgres@db:5432/bop
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me-0123456789}
      APP_VERSION: ${APP_VERSION:-dev}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: bop@localhost
    command: ["node", "backend/src/worker.ts"]
    restart: unless-stopped

  # Dev/test SMTP sink (ADR-13): the worker's nodemailer sends here in dev;
  # UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: bop-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI + REST API (evidence queries)
    restart: unless-stopped

volumes:
  db-data: